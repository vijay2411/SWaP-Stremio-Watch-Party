<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SWaP · Extension visibility fixture</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#08090c;color:#eee;font:14px system-ui}
    .player-container-fixture{position:relative;width:100vw;height:100vh}.video-layer-fixture{position:absolute;inset:0}
    #movie{width:100%;height:100%;object-fit:contain}
    #extension-controls{position:fixed;top:10px;left:10px;z-index:2147483647;display:flex;flex-wrap:wrap;gap:6px;max-width:270px;padding:8px;background:#15171b;border:1px solid #777;border-radius:8px;font-size:11px}
    button{padding:6px;background:#23252e;color:#eee;border:1px solid #777;border-radius:6px}#extension-controls output{width:100%}
    #demo-tools{max-width:270px;font-size:10px!important}
  </style>
</head>
<body>
  <div id="demo-player" class="player-container-fixture"><div class="video-layer-fixture"><video id="movie" src="/demo/sample.webm" muted playsinline preload="auto"></video></div></div>
  <aside id="extension-controls" aria-label="Extension toolbar fixture">
    <span>Local toolbar fixture</span>
    <button id="fixture-show">Show SWaP</button><button id="fixture-hide">Hide SWaP</button><button id="fixture-status">Check visibility</button>
    <output id="fixture-visibility" aria-live="polite"></output>
  </aside>
  <script src="/demo/fixtures.js"></script>
  <script src="/demo/extension.js"></script>
</body>
</html>
